name: Gerar APK Curiosidades Reels
on:
  push:
    branches: [main, feature/reels-crescimento-30dias]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir o projeto Android
        shell: bash
        run: |
          set -euo pipefail
          cat source/part-{01..04}.txt | base64 --decode > /tmp/helper-source.tar.xz
          echo "c42ca8731fada44119ff583be298e6982e9aa1617f6aac2ca54e06d3cfa17367  /tmp/helper-source.tar.xz" | sha256sum --check
          tar --extract --xz --file=/tmp/helper-source.tar.xz
          cat source3/part-{01..05}.txt | base64 --decode > /tmp/helper-v3-patch.tar.xz
          echo "389905dae91c28bf318dc4772c9cf7c442aae696ac4b0ff2c51d4c603aab306c  /tmp/helper-v3-patch.tar.xz" | sha256sum --check
          tar --extract --xz --file=/tmp/helper-v3-patch.tar.xz
          python3 scripts/patch-tts.py
          python3 scripts/patch-captions-v4.py
          python3 scripts/patch-growth.py
          python3 scripts/patch-trends.py
          python3 scripts/patch-strict-trends.py
          python3 scripts/patch-dynamic-topics.py
          python3 scripts/patch-editorial-bridge.py
          python3 scripts/test-editorial-android-contract.py
          python3 scripts/test-trends-runtime.py
          python3 scripts/test-growth.py
          python3 scripts/test-editorial-30dias.py
          python3 scripts/test-roteiro-editorial.py
          python3 scripts/validar-midias-editoriais.py
          python3 scripts/test-empacotar-pauta-android.py
          python3 scripts/editorial-30dias.py
          python3 scripts/patch-smoke-codec.py
          python3 scripts/patch-parallel-install.py
          test -f app/src/main/java/br/com/helper/reels/TrendFeed.java
          test -f app/src/main/java/br/com/helper/reels/FactCatalog.java
          test -f app/src/main/java/br/com/helper/reels/MainActivity.java
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'ICON'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#171B30"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z"/>
              <path android:fillColor="#BA8BFF"
                  android:pathData="M29,21 L88,54 L29,87 Z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M37,35 L70,54 L37,73 Z"/>
          </vector>
          ICON
          sed -i 's|@mipmap/ic_launcher|@drawable/ic_launcher|' app/src/main/AndroidManifest.xml
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK Android 35 sem pacote legado
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          echo "SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK para Android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Conferir identificador real do APK NOVO
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -m1 '^package:'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -m1 '^package:' | grep -q "name='br.com.helper.curiosidadesreels.nova'"
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Helper-Curiosidades-Reels-NOVO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  testar-video:
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Helper-Curiosidades-Reels-NOVO-APK
          path: apk
      - name: Baixar APK anterior para teste de convivencia
        uses: actions/download-artifact@v4
        with:
          name: Helper-Curiosidades-Reels-APK
          run-id: 43660823822
          github-token: ${{ github.token }}
          path: apk-anterior
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar analisador MP4 (FFmpeg / ffprobe)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1
      - name: Habilitar aceleração KVM no emulador
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM indisponível; rodar emulação por software."
          fi
      - name: Executar aplicativo e validar MP4 no Android virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          disk-size: 3G
          disable-animations: false
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: bash scripts/ci-smoke.sh
      - name: Publicar vídeo real gerado no Android
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Helper-Reels-Video-Teste-Android
          path: |
            teste/*.mp4
            teste/*.txt
          if-no-files-found: warn
