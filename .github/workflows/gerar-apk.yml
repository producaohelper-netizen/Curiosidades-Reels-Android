name: Gerar APK Curiosidades Reels
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir o projeto Android
        shell: bash
        run: |
          set -euo pipefail
          cat source/part-{01..04}.txt | base64 --decode > /tmp/helper-source.tar.xz
          echo "c42ca8731fada44119ff583be298e6982e9aa1617f6aac2ca54e06d3cfa17367  /tmp/helper-source.tar.xz" | sha256sum --check
          tar --extract --xz --file=/tmp/helper-source.tar.xz
          cat source3/part-{01..05}.txt | base64 --decode > /tmp/helper-v3-patch.tar.xz
          echo "389905dae91c28bf318dc4772c9cf7c442aae696ac4b0ff2c51d4c603aab306c  /tmp/helper-v3-patch.tar.xz" | sha256sum --check
          tar --extract --xz --file=/tmp/helper-v3-patch.tar.xz
          test -f app/src/main/java/br/com/helper/reels/TrendFeed.java
          test -f app/src/main/java/br/com/helper/reels/FactCatalog.java
          test -f app/src/main/java/br/com/helper/reels/MainActivity.java
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'ICON'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#171B30"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z"/>
              <path android:fillColor="#BA8BFF"
                  android:pathData="M29,21 L88,54 L29,87 Z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M37,35 L70,54 L37,73 Z"/>
          </vector>
          ICON
          sed -i 's|@mipmap/ic_launcher|@drawable/ic_launcher|' app/src/main/AndroidManifest.xml
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK Android 35 sem pacote legado
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          echo "SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK para Android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Helper-Curiosidades-Reels-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  testar-video:
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Helper-Curiosidades-Reels-APK
          path: apk
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android e gerar vídeo real no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb install apk/app-debug.apk
            adb shell pm list packages | grep -i 'tts\|speech' || true
            adb shell am start -n br.com.helper.curiosidadesreels/br.com.helper.reels.MainActivity -a br.com.helper.reels.TEST_GENERATION
            mkdir -p teste
            ready=0
            for i in $(seq 1 100); do
              sleep 8
              if adb shell content query --uri content://media/external/video/media --projection _id:_display_name:is_pending 2>/dev/null | grep -q 'is_pending=0'; then
                ready=1
                break
              fi
              if [ "$((i%10))" = "0" ]; then
                adb logcat -d -s HelperReels:E AndroidRuntime:E | tail -45 || true
              fi
            done
            if [ "$ready" = "0" ]; then
              echo 'ERRO: o app nao gerou video concluido dentro da janela de teste'
              adb logcat -d -s HelperReels:E AndroidRuntime:E | tail -120
              exit 1
            fi
            video=$(adb shell find /sdcard/Movies/HelperReels -type f -name '*.mp4' | tr -d '\r' | head -1)
            if [ -z "$video" ]; then echo 'MP4 nao encontrado'; exit 1; fi
            adb pull "$video" teste/reel-gerado-no-android.mp4
            ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 teste/reel-gerado-no-android.mp4
            ffprobe -v error -show_entries stream=codec_name,codec_type,width,height -of default=noprint_wrappers=1 teste/reel-gerado-no-android.mp4
            ffprobe -v error -select_streams v -show_entries stream=codec_name -of csv=p=0 teste/reel-gerado-no-android.mp4 | grep -q h264
            ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 teste/reel-gerado-no-android.mp4 | grep -q aac
            test "$(stat -c%s teste/reel-gerado-no-android.mp4)" -gt 100000
      - name: Publicar vídeo de teste gerado no emulador
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Helper-Reels-Video-Teste-Android
          path: teste/*.mp4
          if-no-files-found: warn
