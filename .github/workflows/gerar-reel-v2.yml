name: Reels 2.0 — tendencia verificada e voz neural
on:
  workflow_dispatch:
  push:
    paths:
      - 'cloud/**'
      - '.github/workflows/gerar-reel-v2.yml'
  schedule:
    - cron: '12 15 * * *'
permissions:
  contents: write
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restaurar gerador com verificacao da integridade
        shell: bash
        run: |
          set -euo pipefail
          cat cloud/base64/part-{01..04}.txt | base64 -d | gzip -d > cloud/gerar_reel.py
          echo 'ed0ed7ab6ff9d35749290ec2b12a743c3a693d442ac36d6d3d68430d2b10f005  cloud/gerar_reel.py' | sha256sum -c -
          python -m py_compile cloud/gerar_reel.py
      - name: Corrigir filtro de tendencias e disponibilizar FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud/gerar_reel.py')
          s=p.read_text()
          before="if any(normalize(k) in t for k in story['match'])"
          after="if any(re.search(r'(?<!\\w)'+re.escape(normalize(k))+r'(?!\\w)',t) for k in story['match'])"
          assert before in s
          s=s.replace(before,after)
          marker="if __name__=='__main__':asyncio.run(main())"
          assert marker in s
          s=s.replace(marker, "CATALOG['futebol'] = "+"{\"match\":[\" x \",\" vs \",\"futebol\",\"brasileirão\",\"copa do mundo\",\"champions\",\"supercopa\",\"seleção\",\"jogo de futebol\"],\"title\":\"POR QUE A BOLA FAZ CURVA NO FUTEBOL?\",\"label\":\"BOLA FAZ CURVA\",\"art\":\"ball\",\"sources\":[{\"name\":\"MIT News\",\"url\":\"https://news.mit.edu/2014/explained-how-does-soccer-ball-swerve-0617\"},{\"name\":\"Universidade de Rochester\",\"url\":\"https://www.rochester.edu/newscenter/what-is-magnus-effect-definition-how-to-curve-soccer-ball-709592/\"}],\"lines\":[[\"Já viu uma bola fazer curva como se tivesse vontade própria?\",\"BOLA COM VONTADE PRÓPRIA?\",\"ball\"],[\"Parece truque, mas não é!\",\"NÃO É MÁGICA!\",\"remote\"],[\"O chute faz a bola girar enquanto ela atravessa o ar.\",\"GIRO MAIS AR\",\"ball\"],[\"Quando a bola gira, o ar ajuda a empurrá-la de lado.\",\"O AR EMPURRA\",\"arrows\"],[\"E aí vem a curva que deixa o goleiro procurando a bola!\",\"CADÊ A BOLA, GOLEIRO?\",\"ball\"],[\"Até as costuras da bola ajudam a mudar o caminho.\",\"TEXTURA MUDA A CURVA\",\"ball\"],[\"É por isso que fazer essa curva exige treino!\",\"EXIGE TREINO!\",\"sparkle\"],[\"E você, já tentou fazer uma bola dessas? Conta aqui!\",\"VOCÊ JÁ TENTOU?\",\"sources\"]]}"+"\n"+marker)
          old="    else:\n        globe(draw,cx,cy,135,sec*.3)"
          new="    elif mode=='ball':\n        draw.ellipse((cx-145,cy-145,cx+145,cy+145),fill='#f5f9ff',outline=color,width=6)\n        draw.regular_polygon((cx,cy,58),n_sides=5,rotation=20+sec*14,fill='#273957')\n        for n in range(5):\n            a=2*math.pi*n/5+sec*.2\n            x=cx+96*math.cos(a);y=cy+96*math.sin(a)\n            draw.ellipse((x-20,y-20,x+20,y+20),fill='#273957')\n        for n in range(4):\n            x=cx-180-n*25\n            draw.line((x,cy-75+n*40,x-50,cy-75+n*40),fill=color,width=4)\n    else:\n        globe(draw,cx,cy,135,sec*.3)"
          assert old in s
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Diagnosticar referencias tecnicas no roteiro e renderizador
        shell: bash
        run: |
          grep -nEi 'INMET|NOAA|FONTES|sources' cloud/gerar_reel.py | head -65
      - name: Instalar voz neural e renderer
        run: python -m pip install 'edge-tts>=7.3.0' pillow numpy
      - name: Gerar um Reels completo com audio, legendas e animacoes
        run: python cloud/gerar_reel.py
        env:
          REELS_VOICE: pt-BR-FranciscaNeural
          OUTPUT_DIR: produced
      - name: Ajustar duracao com audio e legendas sincronizados
        run: python scripts/normalize-duration.py
      - name: Preparar legenda e serie para Instagram
        run: python scripts/prepare-instagram.py
      - name: Adaptar publicacao para publico leigo
        run: python scripts/audience-editorial.py
      - name: Testar o video REAL exportado
        shell: bash
        run: |
          set -euo pipefail
          test -s produced/latest.mp4
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height -show_entries format=duration -of json produced/latest.mp4 > produced/test-result.json
          python - <<'PY'
          import json
          meta=json.load(open('produced/latest.json'))
          probe=json.load(open('produced/test-result.json'))
          assert 16<meta['duration_s']<90, meta
          assert meta['caption_words']>=30, meta
          assert meta['scenes']>=5, meta
          assert any(s['codec_type']=='video' and s['width']==720 and s['height']==1280 for s in probe['streams']), probe
          assert any(s['codec_type']=='audio' for s in probe['streams']), probe
          print('VALIDADO: narracao neural, alinhamento palavra a palavra, animacoes, exportacao 9:16, fontes.')
          PY
      - name: Auditoria editorial de publicacao (nao bloqueia arquivo de diagnostico)
        continue-on-error: true
        run: python scripts/editorial-qa.py
      - name: Gerar plano editorial de 14 dias e planilha de métricas
        run: python scripts/plan-14-days.py
      - name: Guardar video e prova de qualidade
        uses: actions/upload-artifact@v4
        with:
          name: Reels-2-TESTADO
          path: |
            produced/latest.mp4
            produced/latest.json
            produced/test-result.json
            produced/timings.json
            produced/instagram-post.json
            produced/instagram-legenda.txt
            produced/editorial-qa.json
            planning/plano-14-dias.csv
          retention-days: 30
      - name: Publicar ultimo Reel para o Android
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('produced/editorial-qa.json')
          assert p.exists() and json.loads(p.read_text())['approved'], 'Reel reprovado na auditoria editorial; nao publicar'
          PY
          git config user.name 'Helper Reels Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add produced/latest.mp4 produced/latest.json produced/test-result.json
          git commit -m "Publicar Reels de tendencia verificada [skip ci]" || exit 0
          git push
